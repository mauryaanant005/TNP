name: t_and_p_automation
services:
  # NOTE: MySQL is a managed service provided by TCET IT (Dokploy injects
  # DATABASE_HOST/DATABASE_NAME/DATABASE_USER/DATABASE_PASSWORD at deploy
  # time). Do not add a mysql service here - see TCET hosting standard 6.3.
  #
  # NOTE: There is no reverse-proxy/TLS service here either. Traefik
  # (managed by Dokploy) and Cloudflare Tunnel handle all routing and TLS
  # termination in front of the api/frontend containers.

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # No ports: section - Traefik reaches this container over the internal
    # Docker network by service name ("api").
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    volumes:
      - media:/app/media
    networks:
      # "default" keeps redis reachable; "dokploy-network" is what makes the
      # managed MySQL (DATABASE_HOST) resolvable - without it, compose puts
      # this container on an isolated per-project network, the DB hostname
      # never resolves, entrypoint.sh's wait loop times out and exits, and
      # the container crash-loops forever.
      - default
      - dokploy-network
    healthcheck:
      # X-Forwarded-Proto mimics what Traefik sends, so SECURE_SSL_REDIRECT
      # doesn't answer with a 301 instead of actually exercising the health
      # endpoint. Note DJANGO_ALLOWED_HOSTS must include localhost or Django
      # rejects this request with 400 DisallowedHost and the check can never
      # pass.
      test: ["CMD", "curl", "-f", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A t_and_p_automation worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - RUN_RELEASE_TASKS=0
    depends_on:
      - redis
    volumes:
      - media:/app/media
    networks:
      # Same reasoning as api above - the worker also talks to the managed
      # MySQL, so it needs dokploy-network too.
      - default
      - dokploy-network
    healthcheck:
      # Disables the HTTP healthcheck baked into backend/Dockerfile - this
      # service runs `celery worker`, not Gunicorn, so nothing listens on
      # :8000 here.
      disable: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Self-hosted: unlike MySQL, Redis is NOT a managed service on this
    # platform (TCET hosting standard 6.3). No host port mapping - only
    # api/celery need to reach it, over the internal Docker network.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: .
      dockerfile: client_app/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    # No ports: section - Traefik reaches this container internally too.

networks:
  # Created and owned by Dokploy on the server (it's where the managed
  # database and Traefik live), so it is joined, not defined, here.
  # For LOCAL development this network won't exist - create it once with:
  #   docker network create dokploy-network
  dokploy-network:
    external: true

volumes:
  redis_data:
  media:
