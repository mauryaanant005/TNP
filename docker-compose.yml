services:
  mysql:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    # No host port mapping: only the backend/caddy containers need to reach
    # MySQL, and they do so over the internal Docker network by service name.
    # Publishing 3306 to the host would expose it to the internet on any
    # server without a host firewall blocking it.

  redis:
    image: redis
    restart: always
    # Same reasoning as mysql above: no host port mapping.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]


  backend:
    build: .
    restart: always
    # Not published to the host either - Caddy (ports 80/443) is the only
    # intended public entry point; it reaches this container over the
    # internal Docker network.
    expose:
      - "8000"
    depends_on:
      - mysql
      - redis
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - sqlite_data:/app/data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  staticfiles:
  media:
  sqlite_data:
