{% load static %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    {% tailwind_css %}
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins";
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
      }

      .otp-container {
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

      .otp-down {
        padding: 40px;
      }

      .otp-upper {
        display: flex;
        justify-content: flex-end;
        height: 200px;
      }
      .otp-upper img {
        width: 100px;
        height: 110px;
        border-radius: 10px;
        object-fit: contain;
      }
      .otp-container h1 {
        text-align: center;
        margin-bottom: 5px;
      }

      .otp-underline {
        width: 100px;
        height: 5px;
        background-color: #153f74;
        margin: 0 auto;
        margin-bottom: 30px;
      }

      .otp-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .otp-form input {
        border: none;
        outline: none;
        padding: 10px 0;
        color: #5c5959;
        font-weight: bold;
      }

      .otp-form .inputs {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid gray;
      }

      .otp-form .inputs img {
        width: 25px;
        height: 25px;
      }
      .otp-form button {
        background-color: #153f74;
        color: white;
        padding: 10px 10px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-size: 18px;
        font-weight: 900;
      }

      .otp-form button:hover {
        background-color: #153f74;
      }

      .resend-otp {
        margin-top: 5px;
        display: flex;
        justify-content: center;
        color: #5c5959;
        font-weight: bold;
      }

      .resend-otp a {
        color: #153f74;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="otp-container">
      <div class="otp-upper">
        <svg
          width="243"
          height="250"
          viewBox="0 0 253 354"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect
            x="-346.063"
            y="-341"
            width="709"
            height="328"
            transform="rotate(38 -306.063 -341)"
            fill="#153f74"
          />
        </svg>
        <img src="https://zctindia.org/assets/images/institutes-logo/TCET-LOGO.webp" />
      </div>

      <div class="otp-down">
        <h1>VERIFY OTP</h1>
        <div class="otp-underline"></div>
        <form class="otp-form" method="post">
          {% csrf_token %}
          <div class="inputs">
            <input
              type="text"
              id="otp"
              name="otp"
              required
              placeholder="ENTER OTP"
            />
            <img src={% static "img/lock.png" %} >
          </div>

          <button type="submit">Verify OTP</button>
        </form>
        <div class="resend-otp">
          <a>Resend OTP</a>
        </div>
        {% if messages %}
        <ul>
          {% for message in messages %}
          <li>{{ message }}</li>
          {% endfor %}
        </ul>
        {% endif %}
      </div>
    </div>
  </body>
</html>
